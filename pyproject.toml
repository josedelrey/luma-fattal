[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "luma-fattal"
version = "0.1.0"
description = "Configurable gradient-domain image and video processing"
readme = "README.md"
license = "MIT AND BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "scipy>=1.14,<2", "Pillow>=13,<14", "numba>=0.61,<1", "PyYAML>=6.0.3,<7", "tqdm>=4.67,<5"]

[project.optional-dependencies]
gpu = [
    "cupy-cuda12x>=14.2,<15",
    "nvidia-cuda-runtime-cu12==12.9.*",
    "nvidia-cuda-nvrtc-cu12==12.9.*",
]

[project.scripts]
luma-fattal = "luma_fattal.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/luma_fattal"]

[dependency-groups]
dev = [
    "pyinstaller==6.22.3",
    "pyright>=1.1.414,<2",
    "pytest>=8,<10",
    "ruff>=0.17.4,<0.18",
    "scipy-stubs>=1.17,<1.19",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
extend-exclude = ["local_inputs", "outputs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyright]
include = ["src", "tests", "scripts", "experiments"]
exclude = ["**/__pycache__"]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
