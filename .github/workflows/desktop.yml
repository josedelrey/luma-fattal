name: Desktop packages

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish an unsigned prerelease after all platform checks pass
        type: boolean
        default: false
  pull_request:
    paths: ['.github/workflows/desktop.yml', 'desktop/**', 'scripts/**', 'src/luma_fattal/**', 'configs/**', 'pyproject.toml', 'uv.lock']
  push:
    branches: [main]
    tags: ['v*']
    paths: ['.github/workflows/desktop.yml', 'desktop/**', 'scripts/**', 'src/luma_fattal/**', 'configs/**', 'pyproject.toml', 'uv.lock']

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }} desktop
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux
            os: ubuntu-22.04
            platform: linux
            arch: x64
            gpu: '--extra gpu'
            gpu_build: '--gpu'
            unpacked: outputs/desktop-app/linux-unpacked
            resources: outputs/desktop-app/linux-unpacked/resources
            executable: outputs/desktop-app/linux-unpacked/luma-fattal-desktop
            tool_suffix: ''
          - label: windows
            os: windows-2025
            platform: win
            arch: x64
            gpu: '--extra gpu'
            gpu_build: '--gpu'
            unpacked: outputs/desktop-app/win-unpacked
            resources: outputs/desktop-app/win-unpacked/resources
            executable: outputs/desktop-app/win-unpacked/Luma Fattal.exe
            tool_suffix: .exe
          - label: macos
            os: macos-15
            platform: mac
            arch: arm64
            gpu: ''
            gpu_build: ''
            unpacked: outputs/desktop-app/mac-arm64/Luma Fattal.app
            resources: outputs/desktop-app/mac-arm64/Luma Fattal.app/Contents/Resources
            executable: outputs/desktop-app/mac-arm64/Luma Fattal.app/Contents/MacOS/Luma Fattal
            tool_suffix: ''
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      LUMA_FATTAL_SMOKE_VIDEO: outputs/desktop-app/smoke.mp4
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.11.6'
          python-version: '3.11'
          enable-cache: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Restore verified FFmpeg build
        id: ffmpeg
        uses: actions/cache/restore@v4
        with:
          path: |
            outputs/ffmpeg/prefix
            outputs/ffmpeg/downloads
            outputs/ffmpeg/provenance
          key: desktop-ffmpeg-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('configs/desktop-sources.json', 'scripts/build_desktop_ffmpeg.sh', 'scripts/prepare_desktop_ffmpeg.py') }}
      - name: Install Linux build and desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends build-essential autoconf automake libtool nasm pkg-config xvfb libgtk-3-0 libnss3 libasound2
      - name: Install macOS build tools
        if: runner.os == 'macOS' && steps.ffmpeg.outputs.cache-hit != 'true'
        run: brew install autoconf automake libtool nasm pkgconf
      - name: Install Windows build tools
        if: runner.os == 'Windows' && steps.ffmpeg.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: MINGW64
          install: make autoconf automake libtool mingw-w64-x86_64-gcc mingw-w64-x86_64-pkgconf mingw-w64-x86_64-nasm
      - name: Install locked Python dependencies
        run: uv sync --locked ${{ matrix.gpu }}
      - name: Prepare pinned FFmpeg sources
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: uv run --locked ${{ matrix.gpu }} python scripts/prepare_desktop_ffmpeg.py
      - name: Build FFmpeg on Linux and macOS
        if: runner.os != 'Windows' && steps.ffmpeg.outputs.cache-hit != 'true'
        run: bash scripts/build_desktop_ffmpeg.sh
      - name: Build FFmpeg on Windows
        if: runner.os == 'Windows' && steps.ffmpeg.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash scripts/build_desktop_ffmpeg.sh
      - name: Collect Windows runtime notices
        if: runner.os == 'Windows' && steps.ffmpeg.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          mkdir -p outputs/ffmpeg/provenance/toolchain
          for notice_dir in /mingw64/share/licenses/gcc* /mingw64/share/licenses/mingw-w64* /mingw64/share/licenses/crt*; do
            if [[ -d "$notice_dir" ]]; then cp -R "$notice_dir" outputs/ffmpeg/provenance/toolchain/; fi
          done
      - name: Cache verified FFmpeg build
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            outputs/ffmpeg/prefix
            outputs/ffmpeg/downloads
            outputs/ffmpeg/provenance
          key: ${{ steps.ffmpeg.outputs.cache-primary-key }}
      - name: Build and verify frozen backend
        run: >-
          uv run --locked ${{ matrix.gpu }} python scripts/build_desktop_backend.py
          --ffmpeg outputs/ffmpeg/prefix/bin/ffmpeg${{ matrix.tool_suffix }}
          --ffprobe outputs/ffmpeg/prefix/bin/ffprobe${{ matrix.tool_suffix }}
          --ffmpeg-license outputs/ffmpeg/provenance/LICENSE.txt
          --ffmpeg-provenance outputs/ffmpeg/provenance ${{ matrix.gpu_build }}
      - name: Install Electron dependencies
        run: npm --prefix desktop ci
      - name: Check desktop logic
        run: npm --prefix desktop test
      - name: Add version information and corresponding sources
        run: uv run --locked ${{ matrix.gpu }} python scripts/prepare_desktop_release.py --resources outputs/desktop-release-metadata --platform ${{ matrix.label }} --arch ${{ matrix.arch }}
      - name: Assemble desktop app
        run: npm --prefix desktop run package:dir -- --${{ matrix.platform }} --${{ matrix.arch }}
      - name: Verify macOS ad-hoc signatures
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict "${{ matrix.unpacked }}"
      - name: Check packaged video pipeline
        run: uv run --locked ${{ matrix.gpu }} python scripts/smoke_desktop_backend.py "${{ matrix.resources }}" --save-video outputs/desktop-app/smoke.mp4
      - name: Check packaged window on Linux
        if: runner.os == 'Linux'
        run: LUMA_FATTAL_SMOKE=1 xvfb-run -a "${{ matrix.executable }}" --no-sandbox
      - name: Check packaged window on Windows and macOS
        if: runner.os != 'Linux'
        shell: bash
        run: LUMA_FATTAL_SMOKE=1 "${{ matrix.executable }}"
      - name: Create downloadable archive
        env:
          ELECTRON_BUILDER_COMPRESSION_LEVEL: '5'
        run: npm --prefix desktop run package:release -- --${{ matrix.platform }} --${{ matrix.arch }} --prepackaged "../${{ matrix.unpacked }}"
      - name: Collect release downloads
        shell: bash
        run: |
          mkdir -p outputs/desktop-release
          find outputs/desktop-app -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.dmg' \) -exec cp {} outputs/desktop-release/ \;
      - name: Upload release downloads
        uses: actions/upload-artifact@v4
        with:
          name: luma-fattal-${{ matrix.label }}-${{ matrix.arch }}-release
          path: outputs/desktop-release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Publish prerelease
    needs: build
    if: (github.event_name == 'workflow_dispatch' && inputs.publish) || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: luma-fattal-*-release
          path: outputs/desktop-release
          merge-multiple: true
      - name: Generate checksums
        run: python3 scripts/prepare_desktop_release.py --checksums outputs/desktop-release
      - name: Publish verified prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(node -p "require('./desktop/package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo 'The tag and desktop version must agree.' >&2
            exit 1
          fi
          gh release create "v$version" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease --title "Luma Fattal $version" --notes-file .github/desktop-release-notes.md
          gh release upload "v$version" outputs/desktop-release/* --repo "$GITHUB_REPOSITORY"
          gh release edit "v$version" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
